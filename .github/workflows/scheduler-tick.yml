# Fires due scheduled runs on Vercel Hobby, where Vercel Cron can only run once a day.
# Calls GET /api/cron/tick every 5 minutes (GitHub's minimum; best-effort, can lag under load).
# Needs repo secrets GREENCYCLE_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (same
# value as the Vercel env var); skips cleanly until both are set.
name: Scheduler tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/tick
        env:
          APP_URL: ${{ secrets.GREENCYCLE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "GREENCYCLE_URL / CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/tick"
