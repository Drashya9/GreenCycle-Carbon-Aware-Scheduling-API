# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database ────────────────────────────────────────────────────
# "mem:greencycle" is the database name — it lives purely in RAM.
# DB_CLOSE_DELAY=-1 keeps it alive for the lifetime of the JVM.
spring.datasource.url=jdbc:h2:mem:greencycle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.defer-datasource-initialization=true
# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: build schema on start, destroy on stop
spring.jpa.hibernate.ddl-auto=create-drop
# Log SQL to console so you can see what Hibernate is doing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── H2 Browser Console ───────────────────────────────────────────────────────
# Visit http://localhost:8080/h2-console while the app is running.
# JDBC URL to enter there: jdbc:h2:mem:greencycle
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── External Grid API ────────────────────────────────────────────────────────
# Switch "mock" to "electricitymaps" or "watttime" when you have real API keys.
grid.provider=mock

# Electricity Maps (https://api.electricitymap.org)
# grid.provider=electricitymaps
# grid.electricitymaps.api-key=YOUR_KEY_HERE
# grid.electricitymaps.base-url=https://api.electricitymap.org/v3

# WattTime (https://api.watttime.org)
# grid.provider=watttime
# grid.watttime.username=YOUR_USERNAME
# grid.watttime.password=YOUR_PASSWORD
# grid.watttime.base-url=https://api2.watttime.org/v2

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
